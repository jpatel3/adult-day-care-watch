name: validate
on:
  push:
  pull_request:
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Validate every state
        run: python3 scripts/validate.py
